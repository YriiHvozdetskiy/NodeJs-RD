# Локальний кластер курсового (#28): kind, один вузол.
#
#   npm run cluster:up     # kind create cluster --config k8s/kind-config.yaml + kind load образу
#   npm run cluster:down
#
# Один вузол — свідомо: пам'ять Docker ділять кластер, його поди і решта стеку.
# Вимір пам'яті вузла — у README, розділ Kubernetes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: marketplace
nodes:
  - role: control-plane
    extraPortMappings:
      # NodePort сервісу API -> порт на хості. Сам NodePort мусить лежати в
      # 30000-32767 (вимога Kubernetes); на хості — лише loopback, назовні не світимо.
      - containerPort: 30880
        hostPort: 22880
        listenAddress: "127.0.0.1"
        protocol: TCP
