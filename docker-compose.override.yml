# Dev-надбудова. Compose підхоплює цей файл САМ, без прапорців. У CI його немає.

services:
  api:
    volumes:
      # Монтуємо ТІЛЬКИ src і test: правки з хоста видно без перезбірки образу,
      # цикл «змінив тест → docker compose run --rm api npm test» стає миттєвим.
      #
      # Монтувати весь ./ було б помилкою: хостовий node_modules зібраний під
      # macOS/arm64 і затер би linux-збірки з образу. dist теж лишається
      # всередині контейнера — інакше tsc з хоста й tsc з образу писали б в одну теку.
      - ./src:/app/src
      - ./test:/app/test
