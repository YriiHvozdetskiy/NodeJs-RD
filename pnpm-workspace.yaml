# pnpm-workspace.yaml — тут живе вся конфігурація pnpm для цього репозиторію.
# Одна «воркспейс» з одного пакета: сам корінь. Робимо це не для монорепо, а
# щоб налаштування нижче мали куди лягти — у pnpm 10 вони читаються саме звідси.
packages:
  - '.'

# ─── Захист від supply-chain атак ────────────────────────────────────────────
# Свіжо опублікована версія — найнебезпечніша: скомпрометований пакет
# викривають зазвичай за години-дні. Карантин у 7 днів означає, що ми ставимо
# лише те, що встигли подивитись інші.
minimumReleaseAge: 10080 # 7 днів у хвилинах

# no-downgrade: провал перевірки довіри до пакета не «попереджає», а зупиняє.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # для пакетів, старших за 7 днів, downgrade довіри ігноруємо

# Забороняє «екзотичні» під-залежності у транзитивних пакетах — git-URL, tarball
# із випадкового хоста, file:. Тобто все, що не проходить через реєстр і не має
# ні версії, ні контрольної суми.
blockExoticSubdeps: true

# ─── Контроль install-скриптів ───────────────────────────────────────────────
# Головний вектор атаки в npm — postinstall. strictDepBuilds: pnpm не просто
# промовчить про заблокований скрипт, а завалить install, поки пакет не внесено
# в allowBuilds свідомо.
strictDepBuilds: true

# До #16 тут було порожньо: у дереві не було жодного install-скрипта. Тестовий
# стек (#16) приніс шість — і жоден не потрібен для роботи, тому всі `false`:
# pnpm їх не запускає і не валить install через strictDepBuilds.
#
#   ssh2, cpu-features — testcontainers → dockerode; нативна криптографія для
#                        SSH до віддаленого Docker. Локальний сокет її не потребує
#   protobufjs         — dockerode (gRPC); postinstall лише перевіряє версію CLI
#   unrs-resolver      — jest; postinstall добирає нативний біндинг, який і так
#                        приходить платформною optional-залежністю
#   @parcel/watcher    — jest --watch; збірка з сирців, лише якщо немає prebuilt
#   @scarf/scarf       — @pact-foundation/pact; postinstall шле телеметрію
#                        встановлення. Саме той випадок, від якого цей блок і є
#
# Що додасться далі по курсу, коли справді знадобиться:
#   argon2 / bcrypt   — #24 authn (нативний біндинг, потребує node-gyp)
#   sharp             — #26 files/S3 (обробка зображень)
#   @swc/core         — якщо перейдемо на SWC замість tsc у Nest CLI
# Додавати рядок сюди — свідома дія: означає «я подивився, що цей скрипт робить».
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  cpu-features: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# ─── Пінінг версій ───────────────────────────────────────────────────────────
# Без ^ і ~: `pnpm add` пише точну версію. Разом із minimumReleaseAge це дає
# передбачуваність — та сама команда через місяць поставить те саме.
savePrefix: ''

# ─── Перевірка цілісності ────────────────────────────────────────────────────
# error: будь-який `pnpm run` спершу звіряє node_modules із pnpm-lock.yaml і
# падає, якщо вони розʼїхались. Ловить «а в мене працює» після ручного
# видалення теки чи зміни гілки без переустановки.
verifyDepsBeforeRun: error

# Перевіряє контрольні суми того, що дістається зі стору, а не лише при
# завантаженні. Дорожче на install, але ловить пошкоджений/підмінений стор.
verifyStoreIntegrity: true
