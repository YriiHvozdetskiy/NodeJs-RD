# Локальна інфраструктура курсового проєкту. Поки що — лише Postgres:
# застосунок на цьому етапі зручніше тримати на хості (`npm run start`),
# бо ротація перевіряється через uptime процесу, а не контейнера.
name: marketplace

services:
  db:
    image: postgres:17-alpine
    # Порт відкритий лише на loopback: база має бути доступна з хоста
    # (застосунок запущений там), але не з мережі.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      # Адміністратор потрібен рівно для двох речей: ініціалізації та
      # `ALTER ROLE` у rotate.sh. Застосунок ним НЕ ходить — він ходить
      # роллю app_user, пароль якої лежить у файлі-секреті.
      #
      # Пароль приходить ФАЙЛОМ, не значенням: офіційний образ читає
      # POSTGRES_PASSWORD_FILE при першій ініціалізації тому. У git лежить
      # лише шлях; сам файл генерує scripts/db-up.sh у гітігнорному secrets/.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      POSTGRES_DB: marketplace
    secrets:
      - pg_admin_password
    volumes:
      # Іменований том: без нього дані живуть у шарі контейнера і зникають
      # разом із `docker compose down`.
      - pgdata:/var/lib/postgresql/data
      # Виконається РІВНО ОДИН РАЗ — при першій ініціалізації порожнього тому.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d marketplace']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  pgdata:

secrets:
  # File-based secret: compose монтує вміст у /run/secrets/pg_admin_password
  # усередині контейнера. Файл створює scripts/db-up.sh; без нього голий
  # `docker compose up` впаде з зрозумілою помилкою про відсутній файл —
  # це fail-fast, а не незручність.
  pg_admin_password:
    file: ./secrets/pg_admin_password
