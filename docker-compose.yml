# Локальна інфраструктура курсового проєкту: Postgres, PgBouncer перед ним,
# Pact Broker для контрактних тестів, RabbitMQ для подій домену, два Redis
# (кеш і черга) і (лише для restore-drill) чистий Postgres для відновлення. Застосунок на цьому етапі зручніше тримати на хості
# (`npm run start`), бо ротація перевіряється через uptime процесу, а не
# контейнера.
name: marketplace

services:
  db:
    image: postgres:17-alpine
    # Порт відкритий лише на loopback: база має бути доступна з хоста
    # (застосунок запущений там), але не з мережі.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      # Адміністратор (власник схеми) потрібен для ініціалізації, міграцій
      # TypeORM і `ALTER ROLE` у rotate.sh. Застосунок ним НЕ ходить — він
      # ходить роллю app_user, пароль якої лежить у файлі-секреті.
      #
      # Пароль адміна — дев-креденшел, а не секрет: порт відкритий лише на
      # loopback, і свіжий клон має підніматися голим `docker compose up`,
      # без жодного файла поза git. Дефолт працює рівно там, де PG_ADMIN_PASSWORD
      # не задано (свіжий клон, CI); scripts/db-up.sh задає його зі
      # згенерованого secrets/pg_admin_password, тож на робочій машині
      # дефолт не використовується.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-marketplace-dev}
      POSTGRES_DB: marketplace
    volumes:
      # Іменований том: без нього дані живуть у шарі контейнера і зникають
      # разом із `docker compose down`.
      - pgdata:/var/lib/postgresql/data
      # Виконається РІВНО ОДИН РАЗ — при першій ініціалізації порожнього тому.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Уся тека db/ видима всередині контейнера як /db: schema.sql, seed.sql,
      # indexes.sql і queries/ запускаються через `psql -f /db/…` без копіювання.
      - ./db:/db:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d marketplace']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Пулер на боці БД. Застосунок ходить сюди, а не в db:5432 напряму.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    # Loopback, як і в db: грейдер і застосунок ходять із хоста.
    ports:
      - '127.0.0.1:6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # Свіжий клон: дев-креденшел із репозиторію. Робоча машина: db-up.sh
      # генерує secrets/pgbouncer_userlist.txt зі згенерованих паролів і
      # передає шлях сюди — той самий прийом, що з PG_ADMIN_PASSWORD вище.
      - ${PGBOUNCER_USERLIST:-./pgbouncer/userlist.txt}:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    # Перевіряє весь ланцюжок, а не лише відкритий порт: логін адміном через
    # PgBouncer у Postgres. Пароль береться з того самого userlist, який
    # змонтований, тож перевірка працює і з дев-, і зі згенерованим файлом.
    # Рядок (а не список) compose виконує через shell — як CMD-SHELL.
    healthcheck:
      test: >-
        PGPASSWORD="$$(sed -n 's/^"admin" "\(.*\)"$$/\1/p' /etc/pgbouncer/userlist.txt)"
        psql -h 127.0.0.1 -p 6432 -U admin -d marketplace -Atc 'SELECT 1' >/dev/null
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Pact Broker (#16): тут живуть контракти консюмерів і результати верифікації
  # провайдера — саме з них він відповідає на can-i-deploy.
  #
  # Сховище — sqlite у файловій системі контейнера, а не окремий Postgres і не
  # том. Для локального гейта це і треба: `docker compose rm -sf pact-broker`
  # повертає брокер у порожній стан, і послідовність «не можна → можна»
  # відтворюється на кожному прогоні. Спільному брокеру команди потрібен
  # Postgres — або хмарний PactFlow, куди в CI дивиться secrets.PACT_BROKER_URL.
  pact-broker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    ports:
      - '127.0.0.1:9292:9292'
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/pact_broker.sqlite3
    # 127.0.0.1, а не localhost: у контейнері localhost резолвиться і в ::1, а
    # puma слухає лише IPv4 — healthcheck тоді вічно unhealthy.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat']
      interval: 2s
      timeout: 3s
      retries: 30

  # Брокер подій (#19). 4.2 — LTS-гілка (підтримка до 30.06.2030), а не
  # поточна 4.3: курсовий піде в деплой на #28, і там потрібна версія, яка
  # проживе довше за проєкт. `-management` — HTTP API на 15672: через нього
  # споживач вішає DLX політикою, і через нього ж x-death видно очима в UI.
  rabbit:
    image: rabbitmq:4.2.9-management-alpine
    # Імʼя ноди — rabbit@<hostname>, і дані на томі привʼязані до нього. Без
    # фіксованого hostname перестворений контейнер отримав би нове імʼя і не
    # впізнав би власних черг.
    hostname: rabbit
    # Loopback, як у db: 5672 — AMQP для застосунку й демо, 15672 — UI та API.
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    environment:
      # Той самий прийом, що з PG_ADMIN_PASSWORD: свіжий клон і грейдер
      # отримують дев-креденшел app/app, робоча машина — згенерований
      # secrets/rabbitmq_password (scripts/db-up.sh). Діє лише на порожньому
      # томі; далі пароль вирівнює db-up.sh через rabbitmqctl.
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    volumes:
      # Брокер, що зберігає повідомлення до появи одержувача, не має губити їх
      # на `docker compose down`.
      - rabbitdata:/var/lib/rabbitmq
    # Не «порт відкрився»: TCP 5672 приймає зʼєднання раніше, ніж нода готова
    # до basic.publish, і клієнт у цьому вікні ловить ECONNRESET.
    # check_running відповідає після старту застосунку rabbit, а не Erlang VM.
    #
    # `test -f` перед CLI — не прикраса. Healthcheck виконується від root, і
    # rabbitmq-diagnostics, не знайшовши .erlang.cookie, створює його сам — із
    # власником root. Якщо він встигає раніше за ноду (на порожньому томі це
    # перші 2–3 с), нода від імені rabbitmq не може прочитати cookie, падає з
    # `eacces`, і `up --wait` повертає «unhealthy». Поки cookie немає, нода ще
    # не готова однаково, тож перевірка чесно відповідає «ні» і нічого не пише.
    healthcheck:
      test: ['CMD-SHELL', 'test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity']
      interval: 5s
      start_period: 40s
      start_interval: 1s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Redis під КЕШ (#23). Тут лежить лише копія того, що є в Postgres, тож
  # втратити будь-який ключ можна будь-коли:
  #   • maxmemory + allkeys-lru — на межі памʼяті Redis витісняє найдавніше
  #     прочитане, а не відмовляє в записі. Стоковий конфіг (maxmemory 0,
  #     noeviction) на межі кидав би `OOM command not allowed` на кожен SET;
  #   • --save '' і без AOF — рестарт дає холодний кеш, і це нормально: диск
  #     під копію даних, які все одно протухнуть, — зайва робота.
  # Пароль — той самий прийом, що з PG_ADMIN_PASSWORD: свіжий клон і грейдер
  # отримують дев-креденшел, робоча машина — secrets/redis_password (db-up.sh).
  redis-cache:
    image: redis:8.10.2-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-marketplace-dev}
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    environment:
      # redis-cli бере пароль звідси сам — healthcheck не світить його в аргументах.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-marketplace-dev}
    ports:
      - '127.0.0.1:6379:6379'
    # grep PONG, а не код виходу: на помилку автентифікації redis-cli друкує
    # NOAUTH і все одно виходить з 0.
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Redis під ЧЕРГУ BullMQ (#23) — і під усе, що не можна губити мовчки:
  # сесії й вікна rate-limit. Протилежні до кешу налаштування, тому окремий
  # процес: maxmemory-policy одна на інстанс, і SELECT 1 її не розводить.
  #   • noeviction — документація BullMQ: черга «cannot work properly if Redis
  #     evicts keys arbitrarily». На межі памʼяті запис падає з OOM, і це
  #     видно, а витіснена задача просто зникла б;
  #   • maxmemory усе одно задана: без неї noeviction означає «рости, доки
  #     хост не почне свопити»;
  #   • AOF everysec — рекомендація BullMQ: після падіння губиться щонайбільше
  #     секунда записів, а не все з останнього RDB-знімка.
  redis-queue:
    image: redis:8.10.2-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-marketplace-dev}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-marketplace-dev}
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      # AOF без тому жив би в шарі контейнера й зникав би разом із ним.
      - redisqueuedata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Чистий Postgres для restore-drill. Без профілю `drill` не стартує:
  # scripts/restore-drill.sh піднімає його сам і сам прибирає разом із томом.
  # Том даних навмисно анонімний: `rm -v` зносить його разом із контейнером,
  # тож кожен прогін починається з порожньої бази.
  restore:
    image: postgres:17-alpine
    profiles: ['drill']
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: marketplace-dev
      POSTGRES_DB: marketplace
    volumes:
      - type: volume
        target: /var/lib/postgresql/data
      # Ролі в pg_dump не потрапляють — вони живуть на рівні кластера. Без
      # app_user відновлення впало б на першому ж GRANT з міграцій.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # -h 127.0.0.1 обовʼязковий: поки entrypoint виконує init.sql, Postgres
    # слухає лише unix-сокет, і pg_isready без -h сказав би «готовий» тимчасовому
    # серверу, який за мить перезапуститься посеред pg_restore.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U admin -d marketplace']
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  rabbitdata:
  redisqueuedata:

