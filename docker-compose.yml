# База. Те, що однакове і в dev, і в CI, і в проді.
# Свідомо НЕ містить ані bind-mount на код, ані відкритих портів api —
# усе це живе в docker-compose.override.yml, якого в CI просто немає.

services:
  api:
    build:
      context: .
    # Ім'я З ТЕГОМ. Без тега docker підставляє :latest — і на спільному раннері,
    # де вже лежить чужий hw05-api:latest, compose візьме його замість щойно
    # зібраного. Змінні дають CI підставити свій реєстр і тег збірки.
    image: ${IMAGE:-hw05-api}:${TAG:-local}
    environment:
      # Хост «db» — це ІМʼЯ СЕРВІСУ нижче. DNS усередині мережі compose.
      # Ніякого localhost: localhost у контейнері — це сам контейнер.
      #
      # Дефолту НЕМАЄ навмисно (`:-` дає порожній рядок, а не робочий пароль):
      # цей файл їде в CI, і зашитий сюди пароль став би відомим паролем у проді.
      # Значення приходить із секретів раннера, а в dev — з override-файлу.
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      db:
        # ОСЬ ГОЛОВНЕ. Без condition depends_on чекає лише СТАРТУ процесу
        # Postgres, а не готовності приймати запити — і api падає на
        # першому ж SELECT. HEALTHCHECK для самого api приїжджає з Dockerfile.
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      # Так само без дефолтів. Порожній POSTGRES_PASSWORD — не недогляд:
      # Postgres на ньому свідомо відмовляється ініціалізуватись
      # («superuser password is not specified»), тож CI впаде голосно
      # замість того, щоб тихо піднятись із паролем, відомим усім.
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
    volumes:
      # Іменований том: без нього дані живуть у шарі контейнера
      # і зникають разом із docker compose down.
      - pgdata:/var/lib/postgresql/data
      # Виконається РІВНО ОДИН РАЗ — при першій ініціалізації порожнього тому.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ екранує долар ВІД compose, тож змінну підставляє shell усередині
      # контейнера — з оточення самого контейнера. Перевірка тому працює
      # однаково, звідки б не прийшли креденшели: .env, секрети CI чи override.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    # Портів немає навмисно: база доступна лише всередині мережі compose.
    # Опублікувати 5432 назовні — типова діра в дев-оточенні.

volumes:
  pgdata:
