# База: те, що однакове і в dev, і в CI.
# Свідомо НЕ містить bind-mount'ів на код — вони живуть у docker-compose.override.yml,
# якого в CI просто немає. Той самий поділ, що в ДЗ#5.

# Явне імʼя проєкту. Без нього compose бере його з назви теки — а тека та сама,
# що в ДЗ#5, тож контейнери тієї гілки (db) рахувалися б частиною цього проєкту
# і вилітали б як orphan.
name: mini-nest

services:
  api:
    build:
      context: .
    # Імʼя З ТЕГОМ. Без тега docker підставляє :latest — і на спільному раннері,
    # де вже лежить чужий mini-nest:latest, compose узяв би його замість щойно
    # зібраного. Змінні дають CI підставити свій реєстр і тег збірки.
    image: ${IMAGE:-mini-nest}:${TAG:-local}

    # Портів немає і не буде: цей сервіс нічого не слухає. Він існує рівно для
    # разових задач — `docker compose run --rm api npm test`.
    command: ['npm', 'test']
