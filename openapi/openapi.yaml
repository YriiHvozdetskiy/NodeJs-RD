openapi: 3.0.3

info:
  title: Marketplace API
  version: 1.0.0
  description: |
    Курсовий проєкт (Node.js PRO). Каталог товарів і замовлення.

    Домовленості, які діють на весь API:
      * усі гроші у v1 — цілі копійки в полі `*_cents` (integer). Це рішення
        версії, а не властивість грошей: точну десяткову арифметику дає `NUMERIC`
        у БД плюс decimal-бібліотека в коді, і саме туди API перейде разом зі
        схемою БД. У v1 немає ні того, ні того — дані лежать у памʼяті, тож цілі
        копійки тут найдешевший спосіб не мати похибки. Заборонений назавжди
        лише float: `0.1 + 0.2` в IEEE-754 не дорівнює `0.3`;
      * будь-яка помилка 4xx/5xx — `application/problem+json` за RFC 9457.
        Клієнт розрізняє класи помилок по стабільному URI в полі `type`,
        а не по тексту в `detail`;
      * спискові операції — тільки cursor-пагінація (keyset). Offset не
        підтримується свідомо: під вставками він дублює й губить елементи;
      * версія API живе в `servers.url` (`/v1`), а не в шляхах. v1 і v2 у шляхах
        поруч зʼявляться тільки тоді, коли обидві реально працюватимуть.

# Глобально — порожньо: кожна операція сама каже, чи потрібен їй токен.
# Відкрите — каталог на читання, логін і рефреш; решта — `bearerAuth`.
# Перевіряє токен не валідатор спеки, а AuthGuard застосунку (src/auth/guards.ts):
# підпис, exp і денилист — це не форма запиту.
security: []

servers:
  - url: https://api.marketplace.example/v1
    description: Production
  - url: http://localhost:3000/v1
    description: Локальний запуск (npm start)

tags:
  - name: products
    description: Каталог товарів — читання відкрите, запис для продавця й адміна
  - name: orders
    description: Замовлення покупця
  - name: sessions
    description: |
      Гостьова сесія в cookie `sid`. Стан живе в Redis, і кожен запит із
      cookie продовжує його на `idle_timeout_seconds`.
  - name: auth
    description: |
      Логін, ротація refresh-токена і логаут. Access-токен — JWT ES256 на
      10 хвилин у заголовку `Authorization: Bearer …`; refresh — непрозорий
      рядок на 30 днів, що міняється на кожному рефреші.
  - name: files
    description: |
      Файли у сховищі S3: намір → байти напряму у сховище за presigned URL →
      commit. Байти файла через API не проходять.

paths:
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: Список товарів каталогу
      description: |
        Сторінка товарів у порядку від найновішого. Пагінація — cursor (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Сторінка товарів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: createProduct
      tags: [products]
      summary: Виставити товар
      description: |
        Лише для ролей `seller` і `admin`; покупець отримує `403`. Продавцем
        товару стає власник токена — поля продавця в тілі немає.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
      responses:
        '201':
          description: Товар створено
          headers:
            Location:
              description: Шлях до створеного товару
              schema:
                type: string
                example: /v1/products/26
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'

  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Картка товару
      description: |
        Товар плюс залишок, рейтинг і скільки штук замовили. Віддається з кешу:
        дані можуть відставати до 6 хвилин, а залишок — до наступного
        замовлення цього товару. Справжній залишок перевіряє `POST /orders`.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Товар знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: Список замовлень
      description: |
        Сторінка замовлень у порядку від найновішого. Пагінація — cursor (keyset).
        Покупець бачить лише свої замовлення, адмін — усі.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Сторінка замовлень
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Unexpected'

    post:
      operationId: createOrder
      tags: [orders]
      summary: Створити замовлення
      description: |
        Створює замовлення з позицій кошика від імені власника токена. Операція
        НЕ ідемпотентна за природою HTTP, тому безпечність повтору забезпечує
        заголовок `Idempotency-Key`.
      security:
        - bearerAuth: []
      parameters:
        # Оголошено ІНЛАЙНОМ, а не через $ref, свідомо: `redocly bundle` не
        # розкриває внутрішні $ref, а перевірка з acceptance criteria читає
        # paths./orders.post.parameters[].in напряму — через $ref вона побачила б
        # лише {"$ref": "..."} і дала б `required = undefined`.
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 255
          example: 7f3c1d2e-8a44-4b90-9c11-5e6d7a8b9c01
          description: |
            Ключ безпечного повтору POST. Генерує КЛІЄНТ — UUIDv4 на одну спробу
            оформлення, а не на кожен HTTP-запит: усі retry цієї спроби мусять
            піти з тим самим ключем, інакше сенсу немає.

            Сервер зберігає під ключем відпечаток тіла запиту й готову відповідь
            на 24 години. Поведінка повтору:

            * той самий ключ + те саме тіло → той самий `201` із тим самим `id`
              плюс заголовок `Idempotency-Replay: true`. Обробник повторно НЕ
              виконується: другого замовлення й другого списання не буде;
            * той самий ключ + інше тіло → `422`. Тіло при цьому може бути цілком
              валідним — помилка не в ньому, а в реюзі ключа. Віддати попередню
              відповідь було б брехнею: клієнт просив інше, ніж отримав би;
            * ключ ще «в польоті» (перший запит із ним не завершився) → `409`.
              Повторити пізніше з ТИМ САМИМ ключем; новий ключ створить друге
              замовлення, тобто рівно те, від чого ключ і захищає.

            Через 24 години ключ забувається — той самий ключ створить НОВЕ
            замовлення. Некоректне тіло саме по собі (без реюзу ключа) — це `400`,
            а не `422`: там відмовляє валідація, а не сховище ключів.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: |
            Замовлення створено. За повторного запиту з тим самим ключем і тим
            самим тілом повертається ЦЕЙ САМИЙ ресурс із `Idempotency-Replay: true`.
          headers:
            Location:
              description: Шлях до створеного замовлення
              schema:
                type: string
                example: /v1/orders/3
            Idempotency-Replay:
              description: |
                Присутній зі значенням `true`, якщо відповідь відтворена зі
                сховища ключів, а обробник повторно не виконувався.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Unexpected'

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Одне замовлення за ідентифікатором
      description: |
        Лише власник замовлення або адмін. Чуже замовлення — `403`, неіснуюче — `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Замовлення знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      operationId: changeOrderStatus
      tags: [orders]
      summary: Перевести замовлення в наступний статус
      description: |
        Життєвий цикл: `pending → paid → packed → shipped → delivered`, а також
        `pending → cancelled`. Назад і через крок не можна — `409`.

        Запит із тим статусом, у якому замовлення вже є, — `200` з поточним
        станом і без нової події: повтор після таймауту не породить другого
        сповіщення.

        Кожна справжня зміна статусу публікує подію `order.status` — у
        WebSocket-кімнату `orders:<id>` (socket.io, шлях `/socket.io/`) і в
        SSE-потік `GET /orders/{orderId}/events`. Обидва транспорти живуть поза
        `/v1` і цією спекою не описуються.

        Лише роль `admin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChange'
      responses:
        '200':
          description: Замовлення в запитаному статусі
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Відкрити гостьову сесію
      description: |
        Створює сесію з новим ідентифікатором і віддає його в cookie `sid`.
        Попередня сесію цього браузера, якщо вона була, видаляється.
      responses:
        '201':
          description: Сесію створено
          headers:
            Set-Cookie:
              description: '`sid=…; Path=/; HttpOnly; SameSite=Lax; Max-Age=43200`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'

  /sessions/current:
    get:
      operationId: getCurrentSession
      tags: [sessions]
      summary: Поточна сесія
      description: |
        Сам запит уже продовжив сесію: `expires_at` у відповіді — нова межа.
      responses:
        '200':
          description: Сесія жива
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'
    delete:
      operationId: deleteCurrentSession
      tags: [sessions]
      summary: Закрити сесію
      description: |
        Видаляє сесію в Redis — з наступного запиту вона недійсна на всіх
        інстансах. Ідемпотентно: без сесії відповідь та сама.
      responses:
        '204':
          description: Сесію закрито
          headers:
            Set-Cookie:
              description: '`sid=; Max-Age=0` — браузер видаляє cookie'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Unexpected'

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Увійти — нова сесія і перша пара токенів
      description: |
        Немає такого email і не той пароль — однакова відповідь `401`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Unexpected'

  /auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: Обміняти refresh-токен на нову пару
      description: |
        Кожен refresh-токен працює рівно один раз: успішний рефреш видає нову
        пару, а старий токен позначає використаним. Повторне предʼявлення вже
        використаного токена — ознака крадіжки: сервер відкликає всю сесію
        (усі refresh-токени цього логіна) і відповідає `401`. Після цього `401`
        отримує й новий токен з тієї ж сесії — потрібен новий логін.

        Клієнт має рефрешити ПОСЛІДОВНО: один запит на рефреш на всі вкладки й
        паралельні виклики. Два одночасні рефреші того самого токена сервер
        бачить як повтор.

        `503` — сесію відкликано, але access-токени цієї сесії ще не закриті:
        сховище відкликаних токенів недоступне. Повтор того самого запиту
        безпечний і доводить відкликання до кінця.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Нова пара токенів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Вийти — закрити сесію і відкликати access-токен
      description: |
        Дві дії: усі refresh-токени сесії стають недійсними, а access-токен, з
        яким прийшли, — і решта access-токенів цієї сесії — відкликаються до
        свого `exp`. `503` означає, що друга дія не вдалась: повторити логаут з
        тим самим токеном безпечно.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сесію закрито
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Хто я
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Власник токена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Unexpected'

  /uploads/intent:
    post:
      operationId: createUploadIntent
      tags: [files]
      summary: Намір завантажити файл — ключ обʼєкта і presigned URL
      description: |
        Перший крок двокрокового контракту. Сервер перевіряє тип за allowlist,
        сам складає ключ `uploads/{userId}/{uuid}.{ext}` і створює рядок
        `pending`. Байти клієнт кладе напряму у сховище за `url` (до 10 МіБ) або
        за `parts[].url` (понад 10 МіБ, multipart) — через цей API байти файла
        не проходять. Далі — `POST /uploads/{fileId}/commit`.

        `filename` у ключ не потрапляє і не зберігається: ключ із нього означав
        би право клієнта писати за будь-яким шляхом у бакеті.

        Строк URL — `expires_in`: час передачі на аплінку 1 Мбіт/с плюс 60 с,
        не більше години. Presigned не відкликається, тому строк короткий.

        `200`, а не `201`: файла ще немає, є лише дозвіл його покласти.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Подвійний тап по кнопці з тим самим ключем повертає той самий
            `file_id` і ключ обʼєкта зі свіжими підписами, а не другий файл.
            Той самий ключ з іншим типом чи розміром — `422`.
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadIntentRequest'
      responses:
        '200':
          description: Дозвіл покласти байти у сховище
          headers:
            Cache-Control:
              description: '`no-store` — presigned URL є носієм доступу і в кеш не потрапляє.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'

  /uploads/{fileId}/parts:
    get:
      operationId: getUploadParts
      tags: [files]
      summary: Відновити multipart — які частини вже у сховищі і URL на решту
      description: |
        Сервер питає сховище ListParts і підписує свіжі URL лише на частини, яких
        бракує. Новий процес клієнта після обриву починає звідси й доливає тільки
        відсутнє. Той самий виклик рятує завантаження, якому не вистачило строку
        URL. Файл без multipart або вже завершений — `409`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Стан завантаження у сховищі
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadParts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'

  /uploads/{fileId}/commit:
    post:
      operationId: commitUpload
      tags: [files]
      summary: Зафіксувати завантаження — сервер перевіряє обʼєкт сам
      description: |
        Для multipart спершу CompleteMultipartUpload зі списком частин, який
        сервер бере в сховища (ListParts), а не в клієнта. Далі HeadObject:
        обʼєкта немає або розмір не збігається із заявленим — `409`. Перші байти
        не схожі на заявлений тип — `422`, обʼєкт видаляється. Лише після цього
        статус `completed`. Повтор commit завершеного файла — `200` з тим самим
        станом.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Файл у сховищі і звірений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'

  /files/{fileId}:
    get:
      operationId: downloadFile
      tags: [files]
      summary: Завантажити файл — 302 на presigned GET на хвилину
      description: |
        Власник файла або адмін. Довгоживучий presigned у листі не відкликати
        нічим; тут кожне відкриття проходить гард, а URL у `Location` живе 60 с.
        Сервіс лишається на шляху авторизації, але не на шляху даних.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '302':
          description: Редірект на presigned GET у сховищі
          headers:
            Location:
              description: Presigned URL на 60 с.
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access-токен із `POST /auth/login` або `POST /auth/refresh` — JWT,
        підписаний ES256, живе 10 хвилин.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Скільки елементів віддати на сторінці.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Непрозорий (opaque) токен позиції, який видав сервер у `next_cursor`
        попередньої сторінки. Клієнт НЕ розбирає, не конструює і не змінює його:
        формат є деталлю реалізації сервера й може змінитись без версії API.
        Відсутній параметр = перша сторінка.
      schema:
        type: string
      example: eyJjIjoiMjAyNi0wOC0yMFQwOToxMjowMC4wMDBaIiwiaWQiOjI1fQ

    ProductId:
      name: productId
      in: path
      required: true
      description: Ідентифікатор товару.
      schema:
        type: integer
        minimum: 1

    OrderId:
      name: orderId
      in: path
      required: true
      description: Ідентифікатор замовлення.
      schema:
        type: integer
        minimum: 1

    FileId:
      name: fileId
      in: path
      required: true
      description: Ідентифікатор файла — той самий UUID, що в ключі обʼєкта.
      schema:
        type: string
        format: uuid

  schemas:

    Problem:
      type: object
      description: |
        Єдина форма всіх помилок API — RFC 9457 (problem+json).
        Клієнт матчить помилку по `type` (стабільний URI), людина читає `detail`.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: |
            Стабільний URI класу проблеми — саме по ньому матчить клієнт.
            Перелік закритий: якщо сервер віддасть URI поза цим списком,
            `validateResponses` відкине власну відповідь. Додавати новий тип
            означає спершу дописати його тут.
          enum:
            - https://api.marketplace.example/problems/validation-error
            - https://api.marketplace.example/problems/invalid-cursor
            - https://api.marketplace.example/problems/bad-request
            - https://api.marketplace.example/problems/not-found
            - https://api.marketplace.example/problems/conflict
            - https://api.marketplace.example/problems/idempotency-key-in-flight
            - https://api.marketplace.example/problems/unprocessable-entity
            - https://api.marketplace.example/problems/idempotency-key-reused
            - https://api.marketplace.example/problems/unknown-product
            - https://api.marketplace.example/problems/unauthenticated
            - https://api.marketplace.example/problems/forbidden
            - https://api.marketplace.example/problems/rate-limited
            - https://api.marketplace.example/problems/service-unavailable
            - https://api.marketplace.example/problems/internal
          example: https://api.marketplace.example/problems/not-found
        title:
          type: string
          description: Коротка назва класу проблеми, однакова для всіх випадків цього типу.
          example: Ресурс не знайдено
        status:
          type: integer
          description: HTTP-код відповіді, продубльований у тілі.
          example: 404
        detail:
          type: string
          description: Що саме пішло не так у цьому конкретному випадку.
          example: замовлення 99 не знайдено
        instance:
          type: string
          description: Посилання на конкретний випадок — URI запиту, що породив помилку.
          example: /v1/orders/99
        errors:
          type: array
          description: |
            Розширення (RFC 9457 дозволяє): подробиці валідації тіла чи параметрів.
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer:
                type: string
                description: |
                  JSON Pointer на місце проблеми в запиті. Префікс показує, ЯКА
                  частина запиту не пройшла: `/body/...`, `/query/...`, `/headers/...`.
                example: /body/items
              detail:
                type: string
                description: Що саме не так у цьому місці — текст від валідатора.
                example: must NOT have fewer than 1 items

    Product:
      type: object
      required: [id, title, price_cents, currency, created_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 25
        title:
          type: string
          example: Клавіатура Keychron K2
        price_cents:
          type: integer
          description: |
            Ціна в копійках, цілим числом. Ніколи float. У v2 стане
            decimal-рядком разом із переходом схеми БД на `NUMERIC(12,2)`.
          example: 260000
        currency:
          type: string
          enum: [UAH]
          example: UAH
        created_at:
          type: string
          format: date-time
          example: '2026-08-20T09:12:00.000Z'

    ProductCard:
      type: object
      description: |
        Товар у картці — поля `Product` плюс залишок, рейтинг і попит.
      required: [id, title, price_cents, currency, created_at, stock, rating_avg, rating_count, units_ordered]
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 25
        title:
          type: string
          example: Клавіатура Keychron K2
        price_cents:
          type: integer
          example: 260000
        currency:
          type: string
          enum: [UAH]
          example: UAH
        created_at:
          type: string
          format: date-time
          example: '2026-08-20T09:12:00.000Z'
        stock:
          type: integer
          minimum: 0
          description: Залишок на момент кешування; може відставати.
          example: 14
        rating_avg:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
          description: Середня оцінка; `null`, поки оцінок немає.
          example: 4.35
        rating_count:
          type: integer
          minimum: 0
          example: 87
        units_ordered:
          type: integer
          minimum: 0
          description: Скільки штук замовили за весь час, зі скасованими включно.
          example: 312

    Session:
      type: object
      required: [created_at, expires_at, idle_timeout_seconds]
      additionalProperties: false
      properties:
        created_at:
          type: string
          format: date-time
          example: '2026-10-15T09:12:00.000Z'
        expires_at:
          type: string
          format: date-time
          description: |
            Коли сесія протухне без нових запитів. Кожен запит із cookie
            відсуває цю межу на `idle_timeout_seconds`, але не далі за 12 годин
            від `created_at`.
          example: '2026-10-15T09:42:00.000Z'
        idle_timeout_seconds:
          type: integer
          example: 1800

    CreateProduct:
      type: object
      description: Новий товар. Продавець — власник токена, ціна — у копійках.
      required: [title, category, price_cents, stock]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Клавіатура Keychron K2
        category:
          type: string
          enum: [shoes, clothing, electronics, home, sports, books]
          example: electronics
        price_cents:
          type: integer
          minimum: 1
          example: 260000
        stock:
          type: integer
          minimum: 0
          example: 14

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: olena@marketplace.test
        password:
          type: string
          minLength: 1
          maxLength: 1024
          example: marketplace-dev

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
          example: Zq3x1u0kQ8m6dB9nW2rT5yH7cJ4vL1pA0sE3fG6hK9o

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: 'JWT ES256. Іде в заголовок `Authorization: Bearer …`.'
        refresh_token:
          type: string
          description: |
            Непрозорий рядок. Працює один раз — у відповідь на рефреш приходить новий.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Скільки секунд живе access-токен.
          example: 600

    Me:
      type: object
      required: [id, email, role, token_role]
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 4
        email:
          type: string
          example: olena@marketplace.test
        role:
          type: string
          enum: [buyer, seller, admin]
          description: Роль у базі зараз — джерело правди.
        token_role:
          type: string
          enum: [buyer, seller, admin]
          description: |
            Роль, зашита в access-токен на момент видачі. Гарди вірять саме їй,
            тож після зміни ролі вона відстає до наступного рефрешу.

    ProductPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: |
            Токен наступної сторінки. `null` означає, що сторінок більше немає.
          example: eyJjIjoiMjAyNi0wOC0yMFQwOToxMjowMC4wMDBaIiwiaWQiOjI1fQ

    OrderItem:
      type: object
      description: Позиція кошика — те, що надсилає КЛІЄНТ.
      required: [product_id, qty]
      # Закрито для зайвих полів. Без цього рядка {"product_id":1,"qty":1,
      # "hack":true} проходив у 201: additionalProperties у CreateOrder
      # стосується лише ВЕРХНЬОГО рівня тіла, а не вкладених обʼєктів.
      additionalProperties: false
      properties:
        product_id:
          type: integer
          minimum: 1
          example: 25
        qty:
          type: integer
          minimum: 1
          maximum: 999
          example: 2

    OrderLine:
      type: object
      description: |
        Позиція вже створеного замовлення — те, що ВІДДАЄ сервер.
        Виписана повністю, а не через `allOf` з `OrderItem`: під `allOf` кожна
        підсхема валідується окремо, тож `additionalProperties: false` у
        `OrderItem` відкидав би `unit_price_cents` із сусідньої гілки.
      required: [product_id, qty, unit_price_cents]
      additionalProperties: false
      properties:
        product_id:
          type: integer
          minimum: 1
          example: 25
        qty:
          type: integer
          minimum: 1
          maximum: 999
          example: 2
        unit_price_cents:
          type: integer
          description: |
            Ціна товару в копійках на МОМЕНТ створення замовлення. Копіюється
            в замовлення, а не читається з каталогу: інакше зміна ціни
            перепише історію вже оплачених замовлень.
          example: 260000

    Order:
      type: object
      required: [id, items, total_cents, currency, status, created_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          example: 3
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
        total_cents:
          type: integer
          description: Сума замовлення в копійках. Порахована сервером, не приймається від клієнта.
          example: 520000
        currency:
          type: string
          enum: [UAH]
          example: UAH
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
          example: '2026-08-20T09:12:00.000Z'

    OrderStatus:
      type: string
      enum: [pending, paid, packed, shipped, delivered, cancelled]
      description: |
        v1 створює замовлення тільки в статусі `pending`. Далі — через
        `PATCH /orders/{orderId}`: `pending → paid → packed → shipped → delivered`
        або `pending → cancelled`.
      example: pending

    OrderStatusChange:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'

    OrderPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: Токен наступної сторінки. `null` означає, що сторінок більше немає.
          example: eyJjIjoiMjAyNi0wOC0yMFQwOToxMjowMC4wMDBaIiwiaWQiOjN9

    CreateOrder:
      type: object
      description: |
        Тіло створення замовлення. Ні суми, ні цін клієнт не надсилає — інакше
        він міг би призначити собі власну ціну.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Позиції кошика. Порожній масив — помилка валідації.
          items:
            $ref: '#/components/schemas/OrderItem'

    UploadIntentRequest:
      type: object
      required: [content_type, size]
      additionalProperties: false
      properties:
        filename:
          type: string
          maxLength: 255
          description: Імʼя файла в клієнта. Не потрапляє ні в ключ, ні в базу.
          example: ../../etc/passwd
        content_type:
          type: string
          description: |
            Тип із allowlist: `image/jpeg`, `image/png`, `image/webp` (до 20 МіБ),
            `application/pdf` (до 50 МіБ), `video/mp4` (до 1 ГіБ). Розширення ключа
            сервер бере звідси. Commit звіряє перші байти файла з цим типом.
          example: image/png
        size:
          type: integer
          minimum: 1
          description: Розмір у байтах. Commit звіряє його з HeadObject.
          example: 204800

    PartUrl:
      type: object
      required: [part_number, url]
      additionalProperties: false
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        url:
          type: string
          format: uri
          description: Presigned PUT однієї частини. Тіло — рівно `part_size` байтів (остання — залишок).

    UploadIntent:
      type: object
      required: [file_id, key, status, mode, expires_in]
      additionalProperties: false
      properties:
        file_id:
          type: string
          format: uuid
        key:
          type: string
          description: Ключ обʼєкта, який склав сервер.
          example: uploads/42/1c5f2a0e-6c1d-4a59-9e57-4f3b7f2d9a10.png
        status:
          type: string
          enum: [pending, completed]
          description: '`completed` — лише на повторі intent із тим самим Idempotency-Key після commit; тоді URL немає.'
        mode:
          type: string
          enum: [single, multipart]
        expires_in:
          type: integer
          minimum: 0
          description: Скільки секунд живуть URL у цій відповіді.
        url:
          type: string
          format: uri
          description: '`mode: single` — presigned PUT усього файла.'
        headers:
          type: object
          additionalProperties:
            type: string
          description: '`mode: single` — заголовки, які PUT мусить надіслати: `content-type` накритий підписом.'
        part_size:
          type: integer
          description: '`mode: multipart` — розмір кожної частини, крім останньої: max(5 МіБ, файл / 10 000).'
        part_count:
          type: integer
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PartUrl'

    UploadParts:
      type: object
      required: [file_id, part_size, part_count, uploaded, parts, expires_in]
      additionalProperties: false
      properties:
        file_id:
          type: string
          format: uuid
        part_size:
          type: integer
        part_count:
          type: integer
        uploaded:
          type: array
          description: Номери частин, які вже лежать у сховищі з правильним розміром.
          items:
            type: integer
        parts:
          type: array
          description: Свіжі URL лише на ті частини, яких бракує.
          items:
            $ref: '#/components/schemas/PartUrl'
        expires_in:
          type: integer
          minimum: 0

    StoredFile:
      type: object
      required: [file_id, key, status, content_type, size, etag]
      additionalProperties: false
      properties:
        file_id:
          type: string
          format: uuid
        key:
          type: string
        status:
          type: string
          enum: [pending, completed]
        content_type:
          type: string
        size:
          type: integer
        etag:
          type: string
          nullable: true
          description: ETag зі сховища. У multipart це `"…-N"`, де N — кількість частин, а не MD5 файла.

  responses:
    BadRequest:
      description: Запит не відповідає контракту — параметри, заголовки або тіло.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Ресурс із таким ідентифікатором не існує.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: |
        Запит коректний, але суперечить поточному стану. Три випадки: запит із
        цим `Idempotency-Key` ще опрацьовується (повторити пізніше з тим самим
        ключем), товару не вистачає на складі, або статус замовлення не
        дозволяє запитаного переходу. Це не помилка в даних клієнта.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableEntity:
      description: |
        Тіло синтаксично валідне, але опрацювати його не можна. Два випадки:
        `Idempotency-Key` уже використано з ІНШИМ тілом (віддати попередню
        відповідь було б брехнею), або в позиціях є `product_id`, якого немає
        в каталозі. Клієнт розрізняє їх по полю `type`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthenticated:
      description: |
        Немає чинних креденшелів: токена немає, він зіпсований, протух,
        відкликаний — або сесію закрито. Клієнт рефрешить токен або логіниться
        заново.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: |
        Особа відома, але права немає: не та роль або чужий ресурс. Рефреш
        токена тут не допоможе — новий токен тієї самої особи отримає ту саму
        відмову.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: |
        Ліміт запитів вичерпано: не більше 10 замовлень за будь-які 60 секунд з
        однієї адреси (ковзне вікно, спільне для всіх інстансів API).
      headers:
        Retry-After:
          description: Через скільки секунд у вікні звільниться місце.
          schema:
            type: integer
            minimum: 1
            example: 42
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ServiceUnavailable:
      description: Сховище, без якого операція неможлива, не налаштоване або недоступне.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unexpected:
      description: |
        Будь-яка інша помилка — у тій самій формі problem+json. Оголошено як
        `default` свідомо: інакше `validateResponses: true` відкидав би власну
        500-у відповідь сервера як незадекларовану й ховав першопричину.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
