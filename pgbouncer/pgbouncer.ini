;; PgBouncer перед Postgres курсового. Застосунок ходить сюди (127.0.0.1:6432),
;; а не в db:5432 напряму.
;;
;; Головний рядок — pool_mode = transaction: клієнт тримає зʼєднання з
;; PgBouncer скільки завгодно, а справжній backend Postgres отримує лише на час
;; однієї транзакції. 200 клієнтів ← 10 серверних зʼєднань на пару (база, роль).
;; Що саме це ламає — README, розділ 9.

[databases]
marketplace = host=db port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Паролі у userlist.txt — відкритим текстом, і мають збігатися з паролями
;; ролей у Postgres: PgBouncer перевіряє ними клієнта і ними ж логіниться на
;; сервер. У репозиторії лежить лише дев-креденшел адміна з docker-compose.yml;
;; на робочій машині scripts/pgbouncer-userlist.sh генерує файл із secrets/,
;; а compose монтує саме його (змінна PGBOUNCER_USERLIST).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
;; Серверних зʼєднань на пару (база, роль). Postgres тримає max_connections=100,
;; тож навіть три ролі по 10 лишають базі запас на адмінські сесії та бекап.
default_pool_size = 10
;; Клієнтських зʼєднань — дешеві (кілька кБ у PgBouncer, а не процес Postgres).
max_client_conn = 200

;; Іменовані prepared statements живуть у backend-процесі, а в transaction mode
;; наступна транзакція може потрапити в інший backend → «prepared statement
;; "…" does not exist». PgBouncer >= 1.21 сам відстежує їх і переналаштовує на
;; потрібному сервері. Драйвер pg без `name:` у запиті іменованих не створює,
;; але це страховка на день, коли хтось його додасть.
max_prepared_statements = 200

;; Адмін-консоль: psql -h 127.0.0.1 -p 6432 -U admin -d pgbouncer -c 'SHOW POOLS'
admin_users = admin
stats_users = admin

;; JDBC та деякі GUI шлють extra_float_digits у стартовому пакеті; без цього
;; рядка PgBouncer відмовляє їм у підключенні.
ignore_startup_parameters = extra_float_digits
